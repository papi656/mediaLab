# Alembic configuration for mediaLab (docs/vps-deployment-decisions.md, D7).
#
# There is deliberately no `sqlalchemy.url` here. The database location is already
# owned by one setting, `DATA_DIR` (app/config.py -> Settings.database_url), and a
# second copy of the URL in a committed file is exactly the drift that makes a
# migration run against the wrong database. `migrations/env.py` reads Settings, or
# accepts an already-open connection from `app.db.init_db` when the app (or a test)
# is the caller.
#
# In production this file is executed by the Coolify *pre-deployment* command
# (`alembic upgrade head`), not by the container entrypoint: a failed migration must
# abort the deploy while the old container is still serving. See the runbook.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]
