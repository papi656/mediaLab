[project]
name = "medialab-backend"
version = "0.1.0"
description = "mediaLab — image generation service (OpenRouter proxy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    # Runtime, not dev: `alembic upgrade head` is the Coolify pre-deploy command
    # and the only way a schema change reaches production (D7).
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live and not e2e'"
markers = [
    "live: calls the real OpenRouter API (needs OPENROUTER_API_KEY)",
    "e2e: drives the built SPA in a real Chrome over CDP (needs a built frontend)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]  # FastAPI dependency defaults

[tool.uv]
# Not a distributable package: the app runs from the source tree.
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
